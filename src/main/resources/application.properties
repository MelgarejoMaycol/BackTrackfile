spring.application.name=TrackFilee
server.port=${PORT:8080}

# Cargar secretos locales si existe
spring.config.import=optional:file:./application-secrets.properties

# =========================
# PostgreSQL (Neon)
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-young-wave-ahdvmbc2.c-3.us-east-1.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:}

# Hikari
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =========================
# JWT
# =========================
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# =========================
# SMTP (Gmail)
# =========================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# =========================
# URL pública/base del backend
# =========================
app.base-url=${APP_BASE_URL:https://trackfile-backend.onrender.com}

# =========================
# Uploads
# =========================
app.upload.dir=${APP_UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB